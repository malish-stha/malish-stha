name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write

    steps:
      # lowlighter/metrics commits the SVG to the repo itself (output_action: commit)
      - name: Generate full-year isometric calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: commit
          committer_message: "chore: update isocalendar"
          filename: metrics.plugin.isocalendar.fullyear.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Amber palette to match assets/header.svg
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f5a524&color_dots=#161b22,#3d2a08,#7a5310,#b87a14,#f5a524
            dist/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#fde68a,#fbbf24,#d97706,#92400e

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
